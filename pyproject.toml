[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "field-site-sfm"
version = "0.1.0"
description = "Process Insta360 video and satellite imagery into a georeferenced 3-D reconstruction of a field site"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "scipy>=1.11",
    "click>=8.1",
    "PyYAML>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
sfm-extract-frames = "field_site_sfm.cli.extract_frames:main"
sfm-mark-gcps      = "field_site_sfm.cli.mark_gcps:main"
sfm-run-pipeline   = "field_site_sfm.cli.run_pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v"
